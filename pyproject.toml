[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragfactory"
version = "0.1.0"
description = "RAG Factory -- modular pipeline for turning documents into trusted answers"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]

# Shared interfaces (Ingestor, Chunker, Embedder, ...) every stage depends on
core = []

# Stage 0 — The Suck-Inator
ingest = [
    "pypdf>=4.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
]

# Stage 1 — The Chunk-Inator
chunk = []

# Stage 2 — The Embed-Inator
embed = [
    "numpy>=1.26.0",
    "requests>=2.31"]

# Stage 3 — The Store-Inator (numpy fallback; native ext built separately via ./go build_native)
store = [
    "numpy>=1.26.0",
    "chromadb>=0.5",
    "psycopg[binary]>=3.1",
    "pinecone>=5.0",
]

# Stage 4 — The Find-Inator
retrieve = []

# Stage 5 — The Better-Find-Inator
rerank = ["requests>=2.31"]

# Stage 6 — The Answer-Inator
generate = ["requests>=2.31"]

# Stage 7 — The Evaluate-Inator
evaluate = ["requests>=2.31"]

# Stage 8 — The Observe-Inator
observe = []

# Orchestrator that wires all 9 stages together
pipeline = []

# Install every stage + the orchestrator
all = [
    "ragfactory[core,ingest,chunk,embed,store,retrieve,rerank,generate,evaluate,observe,pipeline]",
]

# Dev / CI
dev = [
    "ragfactory[all]",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "reportlab>=4.0",  # generates a real PDF fixture for test_pdf.py
]

# One distribution, code organized by stage under ragfactory/<stage>/src/ --
# map each dotted subpackage to its stage folder's flat src/ (no redundant
# nested ragfactory/<stage>/ folder inside it).
[tool.setuptools]
packages = [
    "ragfactory.core",
    "ragfactory.ingest",
    "ragfactory.chunk",
    "ragfactory.embed",
    "ragfactory.store",
    "ragfactory.retrieve",
    "ragfactory.rerank",
    "ragfactory.generate",
    "ragfactory.evaluate",
    "ragfactory.observe",
    "ragfactory.pipeline",
]

[tool.setuptools.package-dir]
"ragfactory.core" = "ragfactory/core/src"
"ragfactory.ingest" = "ragfactory/ingest/src"
"ragfactory.chunk" = "ragfactory/chunk/src"
"ragfactory.embed" = "ragfactory/embed/src"
"ragfactory.store" = "ragfactory/store/src"
"ragfactory.retrieve" = "ragfactory/retrieve/src"
"ragfactory.rerank" = "ragfactory/rerank/src"
"ragfactory.generate" = "ragfactory/generate/src"
"ragfactory.evaluate" = "ragfactory/evaluate/src"
"ragfactory.observe" = "ragfactory/observe/src"
"ragfactory.pipeline" = "ragfactory/pipeline/src"

[tool.ruff]
src = ["ragfactory"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["ragfactory"]
# Several stages have provider files with the same basename (e.g. mistral.py
# under both embed/ and rerank/), and none of the tests/ dirs are packages
# (no __init__.py). importlib mode keys imports by full path instead of a
# global bare module name, so same-named test files across stages don't clash.
addopts = "-v --tb=short --import-mode=importlib"
consider_namespace_packages = true
