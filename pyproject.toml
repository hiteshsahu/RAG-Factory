[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raginator"
version = "0.1.0"
description = "RAG Factory -- modular pipeline for turning documents into trusted answers"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]

# Shared interfaces (Ingestor, Chunker, Embedder, ...) every stage depends on
core = []

# Stage 0 — The Suck-Inator
ingest = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
]

# Stage 1 — The Chunk-Inator
chunk = []

# Stage 2 — The Embed-Inator
embed = [
    "numpy>=1.26.0",
    "requests>=2.31"]

# Stage 3 — The Store-Inator (numpy fallback; native ext built separately via ./go build_native)
store = [
    "numpy>=1.26.0",
    "chromadb>=0.5",
    "psycopg[binary]>=3.1",
    "pinecone>=5.0",
]

# Stage 4 — The Find-Inator
retrieve = []

# Stage 5 — The Better-Find-Inator
rerank = ["requests>=2.31"]

# Stage 6 — The Answer-Inator
generate = ["requests>=2.31"]

# Stage 7 — The Evaluate-Inator
evaluate = ["requests>=2.31"]

# Stage 8 — The Observe-Inator
observe = ["prometheus-client>=0.19", "opentelemetry-api>=1.20"]

# Orchestrator that wires all 9 stages together
pipeline = []

# FastAPI bridge connecting the frontend to the real pipeline (api/, not a
# raginator.* subpackage -- a standalone consumer of the library, like scripts/)
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

# Install every stage + the orchestrator + the API bridge
all = [
    "raginator[core,ingest,chunk,embed,store,retrieve,rerank,generate,evaluate,observe,pipeline,api]",
]

# Dev / CI
dev = [
    "raginator[all]",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "reportlab>=4.0",  # generates a real PDF fixture for test_pdf.py
    "opentelemetry-sdk>=1.20",  # in-memory span exporter for test_tracing.py
]

# One distribution, code organized by stage under raginator/<stage>/src/ --
# map each dotted subpackage to its stage folder's flat src/ (no redundant
# nested raginator/<stage>/ folder inside it).
[tool.setuptools]
packages = [
    "raginator.core",
    "raginator.ingest",
    "raginator.chunk",
    "raginator.embed",
    "raginator.store",
    "raginator.retrieve",
    "raginator.rerank",
    "raginator.generate",
    "raginator.evaluate",
    "raginator.observe",
    "raginator.pipeline",
]

[tool.setuptools.package-dir]
"raginator.core" = "raginator/core/src"
"raginator.ingest" = "raginator/ingest/src"
"raginator.chunk" = "raginator/chunk/src"
"raginator.embed" = "raginator/embed/src"
"raginator.store" = "raginator/store/src"
"raginator.retrieve" = "raginator/retrieve/src"
"raginator.rerank" = "raginator/rerank/src"
"raginator.generate" = "raginator/generate/src"
"raginator.evaluate" = "raginator/evaluate/src"
"raginator.observe" = "raginator/observe/src"
"raginator.pipeline" = "raginator/pipeline/src"

[tool.ruff]
src = ["raginator", "api"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

# FastAPI's parameter-injection pattern requires `= File(...)`/`= Form(...)`
# as literal defaults -- that's how it knows to treat the param as a request
# field, not a mistake to flag.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["raginator", "api"]
# Several stages have provider files with the same basename (e.g. mistral.py
# under both embed/ and rerank/), and none of the tests/ dirs are packages
# (no __init__.py). importlib mode keys imports by full path instead of a
# global bare module name, so same-named test files across stages don't clash.
addopts = "-v --tb=short --import-mode=importlib"
consider_namespace_packages = true
