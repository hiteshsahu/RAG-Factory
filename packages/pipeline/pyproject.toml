[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragfactory-pipeline"
version = "0.1.0"
description = "RAG-Factory pipeline orchestrator -- wires the 9 stages together"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# The orchestrator only depends on the shared interfaces: it wires together
# whatever concrete stage implementations are injected at construction time.
dependencies = [
    "ragfactory-core",
]

[project.optional-dependencies]
# Concrete stage implementations, needed to actually build a runnable pipeline
# (e.g. in tests or a demo script) -- not required by the orchestrator itself.
dev = [
    "ragfactory-ingest",
    "ragfactory-chunk",
    "ragfactory-embed",
    "ragfactory-store",
    "ragfactory-retrieve",
    "ragfactory-rerank",
    "ragfactory-generate",
    "ragfactory-evaluate",
    "ragfactory-observe",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
